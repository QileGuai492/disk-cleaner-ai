[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "disk-cleaner"
version = "0.6.3"
description = "AI 驱动的磁盘清理工具"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "openai>=1.0",
    "requests>=2.31",
    "anthropic>=0.34",
    "send2trash>=1.8",
    "psutil>=5.9",
    "pystray>=0.19",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]

[project.scripts]
disk-cleaner = "disk_cleaner.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"disk_cleaner.gui" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
