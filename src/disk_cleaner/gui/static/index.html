<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>AI 磁盘清理工具</title>
<link rel="stylesheet" href="/static/app.css"></head>
<body>
<div class="welcome" id="welcome">
  <div class="welcome-card">
    <h2>开始使用</h2>
    <ol>
      <li>输入目录，点击“开始分析”；不确定时先不勾选 AI。</li>
      <li>结果表的“问”按钮可以追问单个文件；“评估目录”看整体建议。</li>
      <li>清理默认移到备份区，可随时通过“恢复备份”找回。</li>
      <li>系统目录、Junction 和用户关键目录会被安全策略拒绝。</li>
    </ol>
    <div class="row"><button onclick="dismissWelcome()">知道了</button></div>
  </div>
</div>
<div class="welcome" id="dirModal">
  <div class="welcome-card" style="max-width:860px;width:100%">
    <h2>目录汇总</h2>
    <div id="dirBody" style="max-height:60vh;overflow:auto"></div>
    <div class="row"><button onclick="closeDirView()">关闭</button></div>
  </div>
</div>
<div style="display:flex;justify-content:space-between;align-items:flex-start">
<div>
<h1>AI 磁盘清理工具</h1>
<div class="sub">扫描 → AI 分析 → 安全清理</div>
</div>
<select id="themeSelect" onchange="switchTheme(this.value)" style="width:auto;margin-top:4px">
<option value="dark">暗黑</option>
<option value="mono">极简</option>
<option value="gold">鎏金</option>
<option value="forest">森林</option>
<option value="ocean">海洋</option>
<option value="sunset">日落</option>
<option value="lavender">薰衣草</option>
</select>
</div>

<div class="card">
  <h2>扫描磁盘</h2>
  <div style="margin-bottom:10px">
    <span style="position:relative;display:inline-block">
      <input id="path" placeholder="输入目录路径" oninput="saveState()">
      <button class="clear" onclick="$('path').value='';saveState()" title="清空">&#xD7;</button>
    </span>
    <select id="top"><option value="50">50</option><option value="100">100</option><option value="200">200</option><option value="500">500</option><option value="1000">1000</option></select>
    <label class="chk"><input type="checkbox" id="recursive">子目录</label>
    <button id="scanBtn" onclick="handleScan()">开始分析</button>
    <label class="chk" id="aiLabel" title="需先配置 API Key"><input type="checkbox" id="useAI" onchange="toggleAI()" disabled>AI</label>
    <select id="provider" disabled></select>
  </div>
  <div id="progressContainer" style="display:none">
    <div class="progress"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
    <div id="status"></div>
  </div>
</div>

<div class="card" id="resultsCard">
  <h2>分析结果</h2>
  <div class="summary" id="summary"></div>
  <div id="resultsBody">
    <div class="empty">输入路径点击"开始分析"</div>
  </div>
</div>

<div class="chat-panel" id="chatPanel" aria-label="清理顾问">
  <div class="chat-head">
    <div>
      <h3>清理顾问</h3>
      <div class="sub" style="margin:0">只解释证据，不直接删除</div>
    </div>
    <button onclick="closeChat()" title="关闭">&#xD7;</button>
  </div>
  <div class="chat-context" id="chatContext">先分析目录，再打开清理顾问</div>
  <div class="chat-quick" id="chatQuick"></div>
  <div class="chat-messages" id="chatMessages">
    <div class="chat-msg assistant">我会根据本次扫描结果解释文件用途、评估文件夹，并检查跨目录关联。所有删除都会走独立确认流程。</div>
  </div>
  <div class="chat-input">
    <textarea id="chatText" placeholder="问：这个文件能删吗？这个文件夹整体能删吗？" onkeydown="if(event.ctrlKey&&event.key==='Enter'){sendChat()}"></textarea>
    <div class="row">
      <button onclick="closeChat()">关闭</button>
      <button onclick="requestChatPlan()">生成计划</button>
      <button onclick="sendChat()">发送</button>
    </div>
  </div>
</div>

<script src="/static/app.js"></script></body></html>
